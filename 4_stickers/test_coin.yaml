# throwaway test config (2026-09-18): tri-service challenge coin as the responders object
defaults:
  style: 16-bit pixel art illustration, SNES-era aesthetic, chunky visible pixels,
    soft dithered shading, limited palette in slightly sepia, warm tones throughout,
    cozy firelit mood. No text, no words, no letters anywhere. Full-bleed composition
    filling the entire frame edge to edge, main subject centered with generous margin
    around it. Never draw a frame, border, badge, or outline shape around the scene.
