  # Round 4 (2026-09-22): second wide scene for the About page, companion to `hearth`.
  # Composition borrowed from the *Holes* poster: camera on the floor looking straight up
  # through a hole, a ring of faces peering down. Here the hole is the trapdoor from the
  # basement apartment down into the sub-basement lab, and the faces are Peter, Josie,
  # Winnie and the skull. The poster is NOT attached (a reference image eats the scene;
  # see CLAUDE.md); the composition is written out instead. Palette anchored on the
  # hearth output itself ([refs/hearth_scene], gitignored like the other refs). One
  # deliberate cool accent: whatever they are looking at, down here with the camera,
  # throws a faint pale glow up onto their faces.
  - name: trapdoor
    aspect-ratio: "16:9"
    description: >
      Lit and coloured exactly like the scene in [refs/hearth_scene]: the same
      chunky 16-bit pixel art, the same warm sepia palette, the same firelit
      basement apartment. The camera lies flat on the floor of a dark
      sub-basement laboratory and looks straight up at the ceiling. Almost all
      of the picture is that ceiling seen from directly below: heavy rough
      wooden joists and planks in deep shadow, with a few bundles of dried
      herbs and a coil of rope hanging down toward the viewer, and cobwebs in
      the corners. In the middle of the ceiling, filling most of the height of
      the picture and roughly square, is an open trapdoor: a rectangular hole
      cut through the planks, its thick hinged lid thrown back and standing
      open on one side. Through the hole we see up into the warm, firelit
      basement apartment above: the edge of a worn patterned rug at the rim,
      a glimpse of exposed brick wall, a ceiling beam, a soft orange glow from
      an unseen fire. A plain wooden ladder rises through one corner of the
      hole and comes down toward the camera at a steep angle, its rungs
      strongly foreshortened, its top hooked over the rim; it stays at the
      edge of the hole and blocks none of the faces.
      Leaning over the rim of the hole from every side, ringed around it and
      all looking straight down at the camera, are four heads seen from
      directly below and foreshortened, so their faces fill the opening.
      A very tall man with the face of [refs/peter], medium-brown hair and a
      short brown beard, not red, not strawberry blonde, in a black henley,
      both hands braced flat on the rim of the trapdoor, leaning far over the
      edge and staring down: one eyebrow raised, brow furrowed, mouth slightly
      open, puzzled and a little worried. A yellow Labrador mix with the face
      and coloring of [refs/josie], head hanging over the edge, ears falling
      forward toward the camera, head tilted to one side in confusion. A
      brindle mix with the face and coloring of [refs/winnie], head over the
      opposite edge, ears pricked, brows drawn together, worried. And resting
      right on the rim between them, nothing holding it, a bare human skull,
      only the skull, no other bones anywhere, no hands, no ribcage, no spine,
      no skeleton, tipped forward to look straight down, its eye sockets
      glowing orange and its jaw slightly ajar, as if it too is at a loss.
      Their faces are lit from two directions: warm firelight from the room
      behind and above them, and a faint, pale, cool glow rising from below,
      from the thing on the sub-basement floor that they are all staring at
      and that the viewer never sees. The cool glow is subtle; the picture
      stays warm overall. No one is smiling. Nothing else in the picture.

