      toward the camera at a steep angle, its rungs strongly foreshortened,
      its top hooked over the rim; it stays at the edge of the hole and blocks
      none of the faces.
      Leaning over the rim of the hole and all looking straight down at the
      camera are four heads seen from directly below and foreshortened, so
      their faces fill the opening. A very tall man with the face of
      [refs/peter], medium-brown hair and a short brown beard, not red, not
      strawberry blonde, in a black henley, one hand braced on the rim of the
      trapdoor, leaning far over the edge and staring down: one eyebrow
      raised, brow furrowed, mouth slightly open, puzzled and a little
      worried. Exactly one yellow Labrador mix with the face and coloring of
