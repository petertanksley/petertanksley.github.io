# News. One entry per item; the listing sorts by date, newest first.
# Rendered on index.qmd (latest 3, via news-listing-home.ejs) and news.qmd
# (everything, via news-listing.ejs). Mirrors the Research Ring site's
# _media_entries.yaml pattern.
#
# Fields
#   date         YYYY-MM-DD
#   id           short slug; the news page anchors the entry here and the
#                homepage headline links to news.html#<id>
#   title        the headline. Say WHAT THE THING IS, in Peter's voice, not
#                the name of the article/journal/newsletter
#   description  ONE lighthearted sentence. Markdown links [text](url) are
#                allowed and encouraged: they render on the news page and
#                are stripped to plain text on the homepage
#   image        optional; a photo under the blurb on the news page only
#                (www/<file>.jpg, <= 1200 px wide). The homepage stays text
#   image-alt    required with image; one plain sentence for screen readers
#   images       optional, several photos as a two-up grid (news page only):
#                a list of {src, alt, position?}; position is a CSS
#                object-position (e.g. "left center") to steer the 3:4 crop
- date: 2026-10-26
  id: iacp-2026
  title: "Told a room full of police chiefs where the wellness effort should aim"
  description: >
    At IACP 2026 in Orlando, John Violanti, Kathleen Padilla and I walked
    through deaths of despair among officers, and the short version is
    suicide, department-wide, and well past retirement.
  images:
    - src: www/iacp_2026_panel.jpg
      alt: "On the panel stage in front of a blue and green IACP 2026 banner, left to right: Scott Coyne, John Violanti, Kathleen Padilla, and Peter."
    - src: www/iacp_2026_hall.jpg
      alt: "Peter and Vickie Speed in a carpeted conference-center hallway, both wearing IACP badges."
    - src: www/iacp_2026_night.jpg
      alt: "Nighttime selfie of Peter under a lit IACP canopy on a green steel arch."
    - src: www/iacp_2026_moon.jpg
      alt: "Early-morning selfie of Peter in an Orlando hotel courtyard, the moon still up over the water."
      position: left center
- date: 2026-09-22
  id: cincinnati-face-2026
  title: "Took the first responder mortality work on the road to Cincinnati"
  description: >
    Presented the leading causes of death among first responders to the
    Tristate FACE Team, then spent the rest of the trip with the good people of
    UC's School of Criminal Justice, and was especially glad to catch up with
    J.C. Barnes and with Leah Butler, my doctoral cohort-mate and a brand-new mom.
  image: www/uc_2026.jpg
  image-alt: "Peter smiling in front of a brick University of Cincinnati building, banners hung between its columns, under a grey September sky."
- date: 2026-09-19
