  effort_note: ~
  blurb: 'Shortly after starting to work with JC (UC), I got the opportunity to lead
    my first big analytic academic project. We partnered with Temi and Av, using their
    E-Risk study data to examine the genetic contribution to multiple kinds of cognitive
    functions and psychopathologies. We wanted to know how adjusting for that genetic
    contribution changed the association between these mental processes and polyvictimization.
    Long story short: self-control, even after adjusting for genetic contributions,
    was the best predictor of future polyvictimization.'
