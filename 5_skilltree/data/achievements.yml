# achievements.yml — rules for Dungeon Crawler Carl-style system messages when a citation metric moves.
#
# check_achievements.R diffs the two newest snapshots in data/scholar/ against these rules and prints
# what fires; with --log it writes each fired achievement, fully rendered, to data/achievements_log.yml
# (committed). The site renders from that ledger, never from here: achievements.qmd, the homepage card, and via
# build_tree.R the numeral on each hex and the panel's Achievements section. Ledger entries are archival: wording
# edits, new variants and moved rungs here apply only to achievements earned from now on. check_achievements.R --replay
# backfills keys the ledger lacks and keeps the rest as written; --replay --fresh re-renders everything (deliberate
# rewrite of history). Register: ../ACHIEVEMENTS.md.
#
# Shape of a rendered achievement, as in the books:
#   New achievement! <title>
#   <body>                      one or two sentences, second person: the fact, then the mock
#   Reward: <reward line>       a box ("You've received a Silver Appendix Box!") or a joke standing in for one
#
# Fields:
#   id       slug; becomes the ledger key and, later, the news anchor
#   metric   dotted path into a snapshot: scholar.citations | scholar.h_index | scholar.i10 |
#            openalex.citations | articles.<article_id>.scholar
#   trigger  step      fires on any increase (old < new)
#            round     fires when new crosses a multiple of `every` that old had not reached
#            threshold fires once, when new >= `at` and old < `at`
#            log10     fires when new reaches a new power of ten (1, 10, 100, 1000 ...) that old had not
#            ladder    fires when new reaches a rung `at` of the reward tier ladder that old had not
#            revival   (Necromancy) fires when a dormant paper's count rises: at least `min_age` years old and no
#                      citations in the last `dormant_years` complete calendar years nor the current one, judged from
#                      articles.<id>.by_year in the OLD snapshot. Needs by_year in both snapshots (from 2026-10-03)
#            manual    never fires from snapshots: the template for one `kind` of hand-logged event in
#                      data/achievements_manual.yml ({what} {where} {note} {year}); --log renders new events
#   forward_only  true: never fires when the old snapshot lacked the metric (per-event rules; Peter, 2026-10-03)
#   by_tag   {<tag>: {title, body, reward}}: overrides used when the paper carries that tag in articles.yml `tags`
#   A metric of the form articles.*.scholar expands to one rule per paper in articles.yml (ledger id
#   <rule>-<article id>); {paper} {venue} {year} fill from the paper, {times} is "once" or "{new} times".
#   articles.<id>.percentile is the paper's OpenAlex citation percentile among all works of its year (the
#   conservative end of the band; null in the publication year). {top} = 100 - {new}, read as "top N%".
#   {s}      "" when {new} is 1, else "s"
#   min_age  (per-paper rules) years a paper must have behind it, counted in calendar years from the snapshot
#            date, before the rule looks at it. Below that age the paper's value counts as 0, so the first
#            eligible snapshot can still fire the rung it already sits on.
#   Variation (2026-09-20): title, body and a joke reward may each be a LIST of variants. One is picked per firing,
#   seeded from the achievement's key (rule + paper + snapshot date), so the same feat reads differently on different
#   papers and dates but a --replay reproduces the ledger exactly. Never seed from the clock.
#   title    the joke, as in the books: a label, a deadpan statement or an exclamation, vaguely about the feat and
#            never the bare fact (Peter, 2026-09-20: "very funny"). The fact lives in the body. The paper is named by
#            the `paper` field the ledger carries (page and homepage card print it as a byline; the tree panel, which
#            is already the paper, does not). {old} {new} {delta} are filled in everywhere below too
#   body     the fact, then the mock. Second person. Dry, not zany; no profanity; sass about the job,
#            the appendix, peer review and Peter, never about responders dying (CLAUDE.md)
#   reward   EITHER a joke line (text; "Reward:" is prefixed if missing)
#            OR a box: {type: <Box name>, tier: <Tier>} or tier as a ladder [{at: 100, tier: Silver}, ...]
#            A rung may carry `role: lead` (or contributing): it then exists only for papers with that role.
#            `type` may also be a map by the paper's dominant area {biosocial:, criminology:, responders:, mixed:}
#            picking the highest `at` <= new. Tiers ascend Bronze, Silver, Gold, Platinum, Legendary,
#            Celestial. Celestial is reserved (tenure, nothing else).
# Tier logic (ACHIEVEMENTS.md): routine steps get no box, just the mock; per-paper citations climb the
# quarters ladder 1 / 10 / 25 / 50 / 100 = Bronze / Silver / Gold / Platinum / Legendary (Peter, 2026-09-19:
# attainable, not rock-star; log10 left nothing above Gold reachable). Celestial is never on a ladder.

- id: h-index-up
  metric: scholar.h_index
  trigger: step
  title:
    - "Number Go Up."
    - "Somebody Tell the Search Committee."
    - "You've Become Marginally Harder to Ignore."
  body:
    - >-
      One more of your papers has been cited at least {new} times, so the number every hiring committee
      pretends not to look at just ticked over. Took you long enough.
    - >-
      Your h-index is {new}, meaning {new} of your papers have {new} or more citations each. Nobody outside a
      search committee knows what that means. Everyone inside one knows exactly.
    - >-
      The h-index rewards being cited a moderate amount, many times over, which is also a fair description of
      your personality. It is now {new}.
  reward:
    - >-
      Nothing. You went into academia because you thought it was fun, you sick, sick man. Not for the
      money. You get nothing.
    - "Leveling up is your job. You don't get rewards for doing your job."
    - "A brief, warm feeling. It has already passed."

- id: citations-century
  metric: scholar.citations
  trigger: round
  every: 100
  title:
    - "Somebody Read the Appendix."
    - "Please Stop Refreshing Google Scholar."
    - "Cited by the Hundred, Read by the Handful."
  body:
    - >-
      Your work has now been cited {new} times. Not by {new} people: a handful of regulars are doing most
      of the lifting, and one of the regulars is you. Statistically, at least one of them read past the abstract.
    - >-
      {new} citations. Round numbers mean nothing, which is why everyone celebrates them. You will refresh the
      page again tomorrow and it will say {new} then too.
    - >-
      Your work has been cited {new} times. Somewhere in there is a paper that cited you in order to disagree,
      and it counts the same as the rest. Metrics do not hold grudges. You do.
  reward:
    type: Appendix Box
    tier:
      - {at: 100, tier: Silver}
      - {at: 500, tier: Gold}
      - {at: 1000, tier: Platinum}

- id: i10-up
  metric: scholar.i10
  trigger: step
  title:
    - "Ten Is a Number Now."
    - "Line Item Acquired."
    - "Google Would Like a Word."
  body:
    - >-
      Another paper has crossed ten citations, which is the number a paper needs before a metric will
      admit it exists. It will now be counted. Counted is not the same as read.
    - >-
      The i10-index counts your papers with ten or more citations. Yours is {new}. Google invented it, Google
      displays it, and nobody else has ever brought it up in conversation.
    - >-
      Paper number {new} has cleared ten citations. Ten is where a paper stops being a rumour and starts being
      a line item.
  reward:
    - "None. Ten is the minimum. You do not get a box for meeting the minimum."
    - "The knowledge that Google Scholar noticed. Google Scholar notices everything."
    - "None. Somewhere a bibliometrician is nodding, which is the most any of us get."

# 2026-09-27: milestone ladders alongside the step jokes above. The step rules mock every tick; these hand out a
# Committee Box at the round numbers a search committee would actually notice. Ladders, so a jump over two rungs fires
# once at the higher rung. Values at adoption: h 12, i10 15, so nothing fires until the numbers earn it.
- id: h-index-milestone
  metric: scholar.h_index
  trigger: ladder
  title:
    - "The Committee Will See You Now."
    - "Hirsch Would Be Mildly Pleased."
    - "Consistently Fine, {new} Times Over."
  body:
    - >-
      Your h-index has reached {new}: {new} papers with at least {new} citations each. It is the one number a
      search committee reads before deciding whether to read anything else. They still will not read anything else.
    - >-
      h-index {new}. Hirsch proposed it in 2005 as a rough shortcut for physicists, and the rest of academia adopted
      it as scripture within the year. You are now {new} units of scripture.
    - >-
      {new} of your papers have been cited {new} or more times. A wildly cited paper does nothing for this number;
      a moderately cited one does. It is a metric that rewards being consistently fine, and you have been.
  reward:
    type: Committee Box
    tier:
      - {at: 15, tier: Silver}
      - {at: 20, tier: Gold}
      - {at: 25, tier: Platinum}
      - {at: 30, tier: Legendary}

- id: i10-milestone
  metric: scholar.i10
  trigger: ladder
  title:
    - "Double Digits, in Bulk."
    - "A Score Google Made Up, Collected in Quantity."
    - "Officially a Body of Work."
  body:
    - >-
      {new} of your papers now have ten or more citations. Google Scholar invented this index because the h-index
      already existed and they wanted one of their own. You have collected {new} of theirs.
    - >-
      i10-index {new}. Ten citations is roughly where a paper stops being read by its coauthors and starts being read
      by strangers. {new} of yours have made the crossing.
    - >-
      Your i10-index is {new}: {new} papers each cited by at least ten works, one of which was probably you.
      Self-citation counts. Google does not judge. Google records.
  reward:
    type: Committee Box
    tier:
      - {at: 20, tier: Silver}
      - {at: 30, tier: Gold}
      - {at: 50, tier: Platinum}
      - {at: 100, tier: Legendary}

# Peter, 2026-09-20: Bronze for the first citation only where Peter led the paper; a contributing-author paper
# starts at Silver, ten citations in.
- id: paper-cited
  metric: articles.*.scholar
  trigger: ladder
  title:
    - "Someone Was Looking for a Reference."
    - "You've Been Cited. It Was Probably Fine."
    - "Easier to Cite Than to Re-Derive."
    - "Et Al. Sends Their Regards."
    - "Someone Scrolled Past the Abstract."
    - "Reference {new}, Alphabetical by Surname."
  body:
    - >-
      Your {year} paper in {venue} has now been cited {times}. Someone needed exactly what you wrote, or
      needed something to disagree with in print. The record does not say which, and you should not ask.
    - >-
      Your {year} paper in {venue}: cited {times}. Every citation is someone deciding your paper was easier to
      cite than to re-derive. Take the compliment. It is the only kind academia issues.
    - >-
      The {year} {venue} paper has been cited {times}. At least one of those authors read the title, skimmed
      the abstract, and cited it with total confidence. You have done the same. Everyone has.
    - >-
      Cited {times}: your {year} paper in {venue}. Somewhere a reference list grew by one line, and a copy editor
      sighed. That line is you. It will be formatted wrong.
    - >-
      Your {year} paper in {venue} has been cited {times}. A reviewer somewhere wrote "the authors should engage
      with the relevant literature," and you were the relevant literature. Congratulations on being a chore.
    - >-
      Your {year} {venue} paper now has {new} citation{s}, and Google Scholar found every one of them within days,
      which is more attention than it received from the journal that published it.
  reward:
    type:
      biosocial: Flask Box
      criminology: Handcuff Box
      responders: Challenge Coin Box
      mixed: Adventurer Box
    tier:
      - {at: 1, tier: Bronze, role: lead}
      - {at: 10, tier: Silver}
      - {at: 25, tier: Gold}
      - {at: 50, tier: Platinum}
      - {at: 100, tier: Legendary}

# Peter, 2026-09-20: an achievement for starting a lineage. articles.<id>.lineage (written by fetch_scholar.R from
# articles.yml) is the number of papers downstream of a paper that itself builds on none of Peter's earlier work;
# 0 for anything mid-lineage. Fires when a root gains descendants.
- id: paper-lineage
  metric: articles.*.lineage
  trigger: ladder
  title:
    - "Patient Zero."
    - "It Grew Legs."
    - "This Is Your Fault Now."
  body:
    - >-
      Your {year} paper in {venue} builds on none of your earlier work, and {new} later paper{s} of yours now
      build on it. You started something. Ending it is now someone else's problem.
    - >-
      {new} of your later paper{s} trace back to your {year} paper in {venue}, which itself traces back to
      nothing of yours. That makes it a root. Roots get no light and all of the blame.
    - >-
      Your {year} paper in {venue} has {new} descendant{s} and no ancestors on this tree. In genealogy that is
      called a founder. In academia it is called not having read enough beforehand.
  reward:
    type: Heirloom Box
    tier:
      - {at: 1, tier: Silver}
      - {at: 3, tier: Gold}
      - {at: 5, tier: Platinum}
      - {at: 10, tier: Legendary}
  # Peter, 2026-10-04: no "Patient Zero", blame or fault on a paper about people who died. The sass stays on the
  # job and the paper; the variants above stay for everything else.
  by_tag:
    mortality:
      title:
        - "Load-Bearing."
        - "Groundwork."
        - "Built Upon."
      body:
        - >-
          {new} of your later paper{s} build on your {year} paper in {venue}, which builds on nothing of yours. It
          is a foundation now. Nobody looks at foundations; they just build on them.
        - >-
          Your {year} paper in {venue} started a line of work: {new} later paper{s} of yours build on it.
          Surveillance data has a habit of raising the next question before you have finished answering the first.
        - >-
          Your {year} paper in {venue} has {new} descendant{s} on this tree and no ancestors. The groundwork paper.
          It gets cited in the introduction and never thanked, and nothing after it stands without it.

# Peter, 2026-09-20: the first refresh fired twelve of these at once and it read as noise. Now only papers two full
# calendar years old, and only the top 3%: a percentile that runs as high as this one has to be near the ceiling
# before it means anything.
- id: paper-percentile
  metric: articles.*.percentile
  trigger: ladder
  min_age: 2
  title:
    - "Better Than Most Things Nobody Read."
    - "Top {top}%. Of Everything. Including Corrections."
    - "The Bad Metric Likes You."
  body:
    - >-
      Among everything published in {year} that OpenAlex has heard of, your paper in {venue} now sits in the
      top {top}% by citations. Most of the rest was never cited at all, which is either comforting or the
      whole problem.
    - >-
      OpenAlex ranks your {year} paper in {venue} in the top {top}% of everything published that year. The
      comparison set includes conference abstracts, corrections, and a great many things nobody has opened.
      Still. Top {top}%.
    - >-
      Your {year} paper in {venue} out-cites {new}% of {year}. Most of the field is below you on a measure the
      field agrees is bad. Enjoy it exactly as much as that deserves.
  reward:
    type:
      biosocial: Flask Box
      criminology: Handcuff Box
      responders: Challenge Coin Box
      mixed: Adventurer Box
    tier:
      - {at: 97, tier: Silver}
      - {at: 98, tier: Gold}
      - {at: 99, tier: Platinum}
      - {at: 100, tier: Legendary}

# Peter, 2026-10-01: Necromancy. A paper at least three calendar years old with no citations in the last complete
# calendar year (or so far this year) is dormant; the snapshot that shows its OpenAlex count rise raises it. One flat
# Gold box: dormancy is a single threshold, so no ladder on how long it was silent. A paper can rise again if it dies
# again (the key carries the date). {silent} = complete calendar years without a citation, {ys} its plural.
# Mortality papers (tags: [mortality] in articles.yml) take the by_tag wording: the PAPER wakes, is dusted off, turns up
# in the archive. No rising-from-the-dead imagery anywhere near a paper about people who died (CLAUDE.md).
- id: necromancy
  metric: articles.*.openalex
  trigger: revival
  min_age: 3
  dormant_years: 1
  title:
    - "Necromancy."
    - "It's Alive. Technically."
    - "Who Disturbed This Tomb?"
  body:
    - >-
      Your {year} paper in {venue} went {silent} year{ys} without a single citation, and has now been cited again.
      Someone went digging in the literature and brought something back. It was you. You wrote it. It still counts.
    - >-
      After {silent} silent year{ys}, your {year} paper in {venue} has twitched. A new citation. The field had
      quietly agreed to stop mentioning it, and someone did not get the memo.
    - >-
      Your {year} paper in {venue} lay undisturbed for {silent} year{ys}. Then someone cited it. It is shambling
      back into the conversation now, slightly out of date and very confident.
  reward:
    type: Phylactery Box
    tier: Gold
  by_tag:
    mortality:
      title:
        - "Back From the Stacks."
        - "Dusted Off."
        - "Found in the Archive."
      body:
        - >-
          Your {year} paper in {venue} sat on the shelf for {silent} year{ys} without a citation. Someone has
          pulled it down and cited it. Surveillance work keeps; it just waits for someone to need it.
        - >-
          {silent} quiet year{ys}, and now a new citation for your {year} paper in {venue}. Someone found it in
          the archive, blew the dust off and decided it still holds up. It does. The data were the data.
        - >-
          Your {year} paper in {venue} has been cited again after {silent} year{ys} of silence. Nobody announced
          it was coming back. Good papers rarely do. They just turn up in a reference list one day.
      reward:
        type: Archive Box
        tier: Gold

# ---- career counts (Peter, 2026-10-03) ----------------------------------------------------------------------------
# career.* is written into each snapshot by fetch_scholar.R (data/career.yml). Achievements fire moving forward; the
# only retrospective ones are cumulative milestones, which count the whole history and may fire once, at the rung
# already reached, on the first snapshot that carries the count. Per-event rules take forward_only: true.
# Reviews: count only, dated to the refresh. Never a journal or a submission date on the site (blind review).
- id: review-done
  metric: career.reviews
  trigger: step
  forward_only: true
  title:
    - "You Were Reviewer 2."
    - "Unpaid Labor Complete."
    - "Comments to the Authors, Submitted."
  body:
    - >-
      You reviewed a manuscript. You were thorough, fair, and, according to the authors, the reason they need a
      drink. Nobody pays for this. Everybody needs it. That makes {new}.
    - >-
      Review submitted. You asked for a robustness check you would also have refused to run. Fair is fair. Lifetime
      total: {new}.
    - >-
      You turned in a review, roughly on time. The editor will thank you in an automated email and invite you to
      review three more. You are at {new}.
  reward:
    type: Reviewer 2 Box
    tier: Bronze

# Peter, 2026-10-01: reviews have a Bronze ceiling, ever. So the milestone ladder is Bronze all the way up.
- id: review-milestone
  metric: career.reviews
  trigger: ladder
  title:
    - "Reviewer 2, Tenured."
    - "The Editors Have Your Number."
    - "Service to the Field, Itemized."
  body:
    - >-
      You have now reviewed {new} manuscripts. That is {new} papers you read more carefully than their own
      authors' advisors did, for no money and no credit. The box is Bronze. It will always be Bronze.
    - >-
      {new} reviews. Somewhere there is a spreadsheet of reliable reviewers, and you are on it, and that is why
      the invitations keep coming. Decline one occasionally. You will not.
    - >-
      Review number {new}. You have now spent more hours on other people's papers than some of them spent on the
      discussion section. The reward reflects how much the system values this.
  reward:
    type: Reviewer 2 Box
    tier:
      - {at: 10, tier: Bronze}
      - {at: 25, tier: Bronze}
      - {at: 50, tier: Bronze}
      - {at: 100, tier: Bronze}

- id: article-milestone
  metric: career.articles
  trigger: ladder
  title:
    - "Publish, and Then Publish Again."
    - "The CV Needs a Second Page. And a Third."
    - "Prolific, Allegedly."
  body:
    - >-
      Article number {new}. Each one took a year longer than you said it would, and you said it would take a year.
      The publication section of your CV now scrolls.
    - >-
      You have {new} articles out or in press. Somewhere in there are the ones you are proud of and the ones that
      were mostly about getting a student a line on their CV. They count the same. That is the deal.
    - >-
      {new} articles. That is {new} cover letters, {new} sets of reviewer comments, and {new} times you formatted a
      reference list to a style nobody else uses.
  reward:
    type: Bibliography Box
    tier:
      - {at: 10, tier: Bronze}
      - {at: 20, tier: Silver}
      - {at: 30, tier: Gold}
      - {at: 50, tier: Platinum}
      - {at: 100, tier: Legendary}

# ---- manual kinds (Peter, 2026-10-01) ---------------------------------------------------------------------------
# trigger: manual never fires from snapshots. Each rule is the template for one `kind` in data/achievements_manual.yml,
# which is hand-appended; check_achievements.R --log renders new events into the ledger. {what} {where} {note} {year}
# fill from the event. Celestial is reserved: `tenure` is the only rule that awards it, and it never fires on its own.
- id: talk
  trigger: manual
  title:
    - "Podium Acquired."
    - "Next Slide, Please."
    - "Any Questions? There Is Always One Question."
  body:
    - >-
      You presented "{what}" to {where}. Somebody in the third row asked a question that was really a
      comment, and you thanked them for it. That is the job now.
    - >-
      You gave "{what}" at {where}. The slides ran long, the clicker worked twice, and at least one person
      took a photo of the methods slide instead of reading the paper.
    - >-
      "{what}", delivered to {where}. You said "this is preliminary" at least once, and meant it each time.
  reward:
    type: Podium Box
    tier: Silver

- id: grant
  trigger: manual
  title:
    - "Someone Else Is Paying."
    - "The Budget Justification Worked."
    - "Indirect Costs Unlocked."
  body:
    - >-
      "{what}" has been funded by {where}. Somebody read your aims page and believed it. Now you have to do
      what it said.
    - >-
      "{what}" is funded, by {where}. The university will take its share before you see a cent, and it will
      not say thank you. You will be asked for a progress report almost immediately.
    - >-
      You have been given money: "{what}", from {where}. Somewhere a grants officer has opened a new
      spreadsheet with your name on it, and it will follow you for years.
  reward:
    type: Grant Box
    tier: Gold

- id: award
  trigger: manual
  title:
    - "Recognized, Formally."
    - "A Plaque. Somewhere There Is a Plaque."
    - "Peer-Reviewed Approval."
  body:
    - >-
      You have been given the {what} by {where}. A committee met, read files, and chose yours. Committees do not
      usually agree on lunch.
    - >-
      You received the {what} from {where}. It goes at the top of the CV section nobody else has, and in the
      bio you will pretend you did not write yourself.
    - >-
      The {what}, from {where}. Your peers looked at your work and decided, on the record, that it was good.
      They will never say so again in a review.
  reward:
    type: Laurel Box
    tier: Platinum

- id: media
  trigger: manual
  title:
    - "Quoted, Approximately."
    - "As Seen on the Internet."
    - "A Journalist Called Back."
  body:
    - >-
      Your work was covered by {where}: "{what}". They got most of it right. The headline is not your fault, and
      it is still going to be attached to your name.
    - >-
      Your work turned up in {where}: "{what}". Forty minutes of careful explanation became one sentence and
      a stock photo.
    - >-
      "{what}" ran in {where}. The comments section has opinions about your methods. None of them read the paper.
  reward:
    type: Soundbite Box
    tier: Bronze

- id: irb_first_try
  trigger: manual
  title:
    - "Approved Without Modifications."
    - "The Board Had No Notes."
    - "This Has Never Happened Before."
  body:
    - >-
      The IRB approved "{what}" on the first submission. No modifications, no clarifications, no request to
      reword the consent form for a sixth-grade reading level. Nobody will believe you.
    - >-
      "{what}" cleared the IRB without a single round of revisions. Somewhere a compliance officer is checking
      whether the system glitched.
    - >-
      First-pass IRB approval for "{what}". Screenshot the letter. You will need it the next time you tell
      this story and someone says you are lying.
  reward:
    type: Protocol Box
    tier: Legendary

- id: tenure
  trigger: manual
  title:
    - "Tenured."
  body:
    - >-
      You have been granted tenure by {where}. Years of dossiers, external letters and annual reviews, reduced to one
      vote. You are now permanent. So is the committee work.
  reward:
    type: Tenure Box
    tier: Celestial
